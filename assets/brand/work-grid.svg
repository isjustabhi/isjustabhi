    <rect x="24" y="28" width="436" height="224" rx="28" fill="url(#panel)" stroke="#ffffff14"/>
    <rect x="24" y="28" width="436" height="6" rx="3" fill="url(#b1)"/>
    <text x="56" y="92" fill="#7dd3fc" font-size="13" letter-spacing="4" font-weight="700">01 · PAPER</text>
    <text x="56" y="148" fill="#f8fafc" font-size="36" font-weight="800">LLM-HyPZ</text>
    <text x="56" y="188" fill="#94a3b8" font-size="16">Published pipeline over 114k CVEs</text>
    <text x="56" y="218" fill="#64748b" font-size="14">IEEE ICDMW 2025</text>

    <!-- card 2 -->
    <rect x="482" y="28" width="436" height="224" rx="28" fill="url(#panel)" stroke="#ffffff14"/>
    <rect x="482" y="28" width="436" height="6" rx="3" fill="url(#b2)"/>
    <text x="514" y="92" fill="#c7d2fe" font-size="13" letter-spacing="4" font-weight="700">02 · RESEARCH</text>
    <text x="514" y="148" fill="#f8fafc" font-size="36" font-weight="800">PersonaeAI</text>
