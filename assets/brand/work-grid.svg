    <rect x="940" y="28" width="436" height="6" rx="3" fill="url(#b3)"/>
    <text x="972" y="92" fill="#5eead4" font-size="13" letter-spacing="4" font-weight="700">03 · OPEN SOURCE</text>
    <text x="972" y="148" fill="#f8fafc" font-size="32" font-weight="800">Systematic Review</text>
    <text x="972" y="188" fill="#94a3b8" font-size="16">Literature coder · 20 ’ 309 papers</text>
