  <rect x="1160" y="40" width="180" height="40" rx="20" fill="#22d3ee18" stroke="#22d3ee55"/>
  <text x="1250" y="66" text-anchor="middle" fill="#67e8f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">NOW LIVE</text>
