<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-label="Abhi — isjustabhi">
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="55%" stop-color="#06101c"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
    <radialGradient id="moon" cx="78%" cy="32%" r="34%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" fill="url(#sky)"/>
  <rect width="1400" height="560" fill="url(#moon)"/>

  <!-- desert horizon -->
  <path d="M0 470 C220 450, 420 490, 640 465 C860 440, 1080 485, 1400 455 L1400 560 L0 560 Z" fill="#040914" opacity="0.9"/>
  <path d="M0 485 C260 470, 500 505, 760 480 C980 460, 1200 500, 1400 475 L1400 560 L0 560 Z" fill="#02060d"/>

  <!-- stars -->
  <g fill="#f8fafc">
    <circle cx="920" cy="78" r="1.5" opacity="0.75"/>
    <circle cx="1010" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="1125" cy="70" r="1.8" opacity="0.85">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="145" r="1.2" opacity="0.55"/>
    <circle cx="1295" cy="95" r="1.4" opacity="0.7"/>
    <circle cx="980" cy="190" r="1" opacity="0.4"/>
    <circle cx="1180" cy="220" r="1.3" opacity="0.6"/>
    <circle cx="1340" cy="180" r="1.1" opacity="0.45"/>
    <circle cx="870" cy="140" r="1.2" opacity="0.5"/>
  </g>

  <!-- shuttle arc + shuttlecock -->
  <path d="M760 390 C900 250, 1080 180, 1288 140" fill="none" stroke="url(#arc)" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(1288,140) rotate(-28)">
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="#e2e8f0"/>
    <path d="M-10 -2 L-28 -14 L-22 0 L-28 14 Z" fill="#67e8f9" opacity="0.9"/>
    <path d="M-8 0 L-24 -8 M-8 0 L-24 0 M-8 0 L-24 8" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7"/>
  </g>
  <circle cx="1288" cy="140" r="22" fill="#67e8f9" opacity="0.12">
    <animate attributeName="r" values="18;28;18" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.05;0.18" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- slash A -->
  <g transform="translate(72,58)">
    <path d="M6 54 L30 6 L54 54 M16 36 H44" fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="28" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="800" letter-spacing="6">ISJUSTABHI</text>
    <text x="74" y="54" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Tucson nights · lab days · court evenings</text>
  </g>

  <text x="64" y="290" fill="url(#name)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="180" font-weight="800" letter-spacing="-10">Abhi.</text>
  <text x="72" y="360" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30">Just Abhi. Building things, chasing ideas,</text>
  <text x="72" y="400" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30">and smashing shuttlecocks.</text>

  <rect x="72" y="440" width="236" height="52" rx="26" fill="#f8fafc"/>
  <text x="190" y="473" text-anchor="middle" fill="#020617" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">isjustabhi.com</text>
  <rect x="324" y="440" width="250" height="52" rx="26" fill="#ffffff10" stroke="#ffffff30"/>
  <text x="449" y="473" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700">Book an appointment</text>
</svg>
