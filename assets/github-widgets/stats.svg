
    <svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
      <style>
        
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2f80ed; 
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .stat { 
      font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333;
    }
    .stagger { 
      opacity: 0;
      animation: fadeIn 0.3s ease-in-out forwards;
    }
    .rank-text { 
      font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333; 
      animation: scaleIn 0.3s ease-in-out forwards;
    }
    
    .bold { font-weight: 700 }
    .star-icon { 
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
    }
    .icon {
      fill: #4c71f2;
      display: block;
    }
    
    .rank-circle-rim {
      stroke: #2f80ed;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }
    .rank-circle {
      stroke: #2f80ed;
      stroke-dasharray: 250;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.8;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      animation: rankAnimation 1s forwards ease-in-out;
    }

    
    /* Animations */
    @keyframes scaleIn {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes rankAnimation {
      from {
        stroke-dashoffset: 251.32741228718345;
      }
      to {
        stroke-dashoffset: 150.20044236602902;
      }
    }
  
  
      </style>
      
      

      <g data-testid="rank-circle" transform="translate(400, 105.4054054054054)">
        <circle class="rank-circle-rim" cx="-10" cy="8" r="40" />
        <circle class="rank-circle" cx="-10" cy="8" r="40" />
        <text
          x="0"
          y="0"
          alignment-baseline="central"
          dominant-baseline="central"
          text-anchor="middle"
          class="rank-text"
        >
          B+
        </text>
      </g>
      
      <text x="25" y="35" class="header" style="font-family: sans-serif;">My GitHub Stats</text>

      <svg x="0" y="45">
        
    <text class="stagger" style="animation-delay: 0ms" x="25" y="25">
      <tspan dx="0" data-testid="icon" class="icon star-icon">★</tspan>   
      <tspan dx="0" class="stat bold">
       Total Stars:
      </tspan>
      <tspan x="160" data-testid="stars" class="stat">1</tspan>
    </text>
  
    <text class="stagger" style="animation-delay: 0ms" x="25" y="50">
      <tspan dx="0" data-testid="icon" class="icon false">🕗</tspan>   
      <tspan dx="0" class="stat bold">
       Total Commits:
      </tspan>
      <tspan x="160" data-testid="commits" class="stat">1</tspan>
    </text>
  
    <text class="stagger" style="animation-delay: 0ms" x="25" y="75">
      <tspan dx="0" data-testid="icon" class="icon false">🔀</tspan>   
      <tspan dx="0" class="stat bold">
       Total PRs:
      </tspan>
      <tspan x="160" data-testid="prs" class="stat">4</tspan>
    </text>
  
    <text class="stagger" style="animation-delay: 0ms" x="25" y="100">
      <tspan dx="0" data-testid="icon" class="icon false">ⓘ</tspan>   
      <tspan dx="0" class="stat bold">
       Total Issues:
      </tspan>
      <tspan x="160" data-testid="issues" class="stat">0</tspan>
    </text>
  
    <text class="stagger" style="animation-delay: 0ms" x="25" y="125">
      <tspan dx="0" data-testid="icon" class="icon false">📕</tspan>   
      <tspan dx="0" class="stat bold">
       Contributed to:
      </tspan>
      <tspan x="160" data-testid="contribs" class="stat">1</tspan>
    </text>
  
      </svg>
    </svg>
  