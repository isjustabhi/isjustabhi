# Refresh profile README images daily so widgets stay visible when
# public CDNs rate-limit or return 503/402.
name: Refresh profile widgets

on:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download widget images
        run: |
          set -euo pipefail
          mkdir -p assets/github-widgets

          fetch_with_fallback() {
            out="$1"
            shift
            echo "Fetching $out"
            for url in "$@"; do
              if curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out.tmp"; then
                if ! grep -qiE 'could not fetch|something went wrong|rate limit|error' "$out.tmp"; then
                  mv "$out.tmp" "$out"
                  echo "OK: $url"
                  return 0
                fi
                echo "Bad response from $url"
              fi
            done
            rm -f "$out.tmp"
            echo "::warning::All sources failed for $out — keeping previous file if present"
            test -s "$out" || exit 1
          }

          fetch_with_fallback assets/github-widgets/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=isjustabhi&show_icons=true&hide_border=true&bg_color=070b12&title_color=60A5FA&icon_color=60A5FA&text_color=F8FAFC&ring_color=3B82F6"

          fetch_with_fallback assets/github-widgets/streak.svg \
            "https://streak-stats.demolab.com/?user=isjustabhi&hide_border=true&background=070b12&ring=3B82F6&fire=F59E0B&currStreakLabel=60A5FA&sideLabels=94A3B8&dates=64748B&currStreakNum=F8FAFC&sideNums=F8FAFC"

          fetch_with_fallback assets/github-widgets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=isjustabhi&layout=compact&langs_count=6&hide_border=true&bg_color=070b12&title_color=60A5FA&text_color=F8FAFC"

          fetch_with_fallback assets/github-widgets/trophies.svg \
            "https://github-profile-trophy.vercel.app/?username=isjustabhi&theme=onedark&no-frame=true&row=1&column=7&margin-w=10"

      - name: Commit updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-widgets/
          git diff --staged --quiet && echo "No widget changes" && exit 0
          git commit -m "chore: refresh GitHub profile widget images"
          git push
