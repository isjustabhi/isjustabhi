# Refresh profile README images daily so widgets stay visible when
# public CDNs rate-limit or return 503/402.
name: Refresh profile widgets

on:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download widget images
        run: |
          set -euo pipefail
          mkdir -p assets/github-widgets

          fetch_with_fallback() {
            out="$1"
            shift
            echo "Fetching $out"
            for url in "$@"; do
              if curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out.tmp"; then
                if ! grep -qiE 'could not fetch|something went wrong|rate limit|error' "$out.tmp"; then
                  mv "$out.tmp" "$out"
                  echo "OK: $url"
                  return 0
                fi
                echo "Bad response from $url"
              fi
            done
            rm -f "$out.tmp"
            echo "::warning::All sources failed for $out — keeping previous file if present"
            test -s "$out" || exit 1
          }

          fetch_with_fallback assets/github-widgets/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=isjustabhi&show_icons=true&theme=radical&hide_border=false" \
            "https://github-stats.vercel.app/api?username=isjustabhi&show_icons=true&theme=radical&hide_border=false"

          fetch_with_fallback assets/github-widgets/streak.svg \
            "https://streak-stats.demolab.com/?user=isjustabhi&theme=radical&hide_border=false" \
            "https://github-readme-streak-stats.herokuapp.com/?user=isjustabhi&theme=radical&hide_border=false"

          fetch_with_fallback assets/github-widgets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=isjustabhi&theme=radical&layout=compact&hide_border=false&langs_count=8" \
            "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=isjustabhi&theme=radical"

          fetch_with_fallback assets/github-widgets/trophies.svg \
            "https://profile-trophy.vercel.app/?username=isjustabhi&theme=radical&no-bg=true&margin-w=4&row=2&column=4" \
            "https://github-profile-trophy.vercel.app/?username=isjustabhi&theme=radical&no-bg=true&margin-w=4&row=2&column=4"

      - name: Commit updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-widgets/
          git diff --staged --quiet && echo "No widget changes" && exit 0
          git commit -m "chore: refresh GitHub profile widget images"
          git push
