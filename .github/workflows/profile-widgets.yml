# Refresh profile README images daily so widgets stay visible when
# public CDNs (github-readme-stats.vercel.app, etc.) rate-limit or return 503/402.
name: Refresh profile widgets

on:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download widget images
        run: |
          set -euo pipefail
          mkdir -p assets/github-widgets

          fetch() {
            url="$1"
            out="$2"
            echo "Fetching $out"
            if ! curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out"; then
              echo "::warning::Failed to fetch $out — keeping previous file if present"
              test -s "$out" || exit 1
            fi
          }

          fetch "https://github-stats.vercel.app/api?username=isjustabhi&show_icons=true&theme=radical&hide_border=false" \
            assets/github-widgets/stats.svg

          fetch "https://streak-stats.demolab.com/?user=isjustabhi&theme=radical&hide_border=false" \
            assets/github-widgets/streak.svg

          fetch "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=isjustabhi&theme=radical" \
            assets/github-widgets/top-langs.svg

          fetch "https://profile-trophy.vercel.app/?username=isjustabhi&theme=radical&no-bg=true&margin-w=4&row=2&column=4" \
            assets/github-widgets/trophies.svg

      - name: Commit updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-widgets/
          git diff --staged --quiet && echo "No widget changes" && exit 0
          git commit -m "chore: refresh GitHub profile widget images"
          git push
